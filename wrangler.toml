name = "stremio-memory-catalog"
main = "worker/index.js"
compatibility_date = "2026-10-13"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[routes]]
pattern = "stremio.juzemaru.com"
custom_domain = true

[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = true

[browser]
binding = "BROWSER"

