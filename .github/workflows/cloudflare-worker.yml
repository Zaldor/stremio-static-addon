name: Deploy Stremio Memory Catalog to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'site/**'
      - 'tests/**'
      - 'package.json'
      - 'wrangler.toml'
      - '.github/workflows/cloudflare-worker.yml'
  pull_request:
    paths:
      - 'worker/**'
      - 'site/**'
      - 'tests/**'
      - 'package.json'
      - 'wrangler.toml'
      - '.github/workflows/cloudflare-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check code
        run: npm run check
      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

